[package]
name = "meshcast-bot"
description = "Discord bot for Meshcast: /link, /stream and the Watch button"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "meshcast-bot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs-next = "2"
futures-lite = "2"
iroh = { workspace = true }
iroh-gossip = { workspace = true }
meshcast-signal = { path = "../meshcast-signal" }
rand = "0.8"
poise = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
