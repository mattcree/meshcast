[package]
name = "meshcast-app"
description = "Meshcast desktop window: status, pairing and stream consent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "meshcast-app"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.33.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
meshcast-signal = { path = "../meshcast-signal" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = { version = "27", default-features = false, features = ["vulkan", "gles"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.19"
