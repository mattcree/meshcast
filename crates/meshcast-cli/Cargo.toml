[package]
name = "meshcast-cli"
description = "Meshcast CLI: stream, watch, link and the background daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "meshcast"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-lite = "2"
iroh = { workspace = true }
meshcast-signal = { path = "../meshcast-signal" }
eframe = { version = "0.33.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
iroh-live = { workspace = true, features = ["h264", "opus", "capture-screen"] }
moq-media = { workspace = true }
moq-media-egui = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
