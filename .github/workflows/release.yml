name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04: cros-libva (VA-API, via moq-media) needs libva >= 2.20, which
          # 22.04 lacks. Resulting Linux binaries need glibc >= 2.39 (Ubuntu 24.04+, Fedora 40+).
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: meshcast-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: meshcast-macos-aarch64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: meshcast-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: meshcast-windows-x86_64.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev libspa-0.2-dev \
            libclang-dev libva-dev nasm pkg-config cmake \
            libasound2-dev libgbm-dev libvulkan-dev \
            libxkbcommon-dev libgtk-3-dev libatk1.0-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install nasm cmake pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p meshcast-app -p meshcast-cli

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p dist/meshcast
          cp target/${{ matrix.target }}/release/meshcast dist/meshcast/
          cp target/${{ matrix.target }}/release/meshcast-app dist/meshcast/
          cp scripts/meshcast-tray.py scripts/install.sh scripts/uninstall.sh dist/meshcast/
          cp packaging/linux/*.desktop dist/meshcast/
          cp README.md LICENSE dist/meshcast/
          tar czf ${{ matrix.archive }} -C dist meshcast

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist/meshcast
          cp target/${{ matrix.target }}/release/meshcast dist/meshcast/
          cp target/${{ matrix.target }}/release/meshcast-app dist/meshcast/
          cp scripts/install.sh scripts/uninstall.sh dist/meshcast/
          cp README.md LICENSE dist/meshcast/
          tar czf ${{ matrix.archive }} -C dist meshcast

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/meshcast | Out-Null
          Copy-Item target/${{ matrix.target }}/release/meshcast.exe dist/meshcast/
          Copy-Item target/${{ matrix.target }}/release/meshcast-app.exe dist/meshcast/
          Copy-Item scripts/install.ps1 dist/meshcast/
          Copy-Item README.md,LICENSE dist/meshcast/
          Compress-Archive -Path dist/meshcast -DestinationPath ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  bot:
    name: Bot (linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bot
      - name: Build
        run: cargo build --release --locked -p meshcast-bot
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist/meshcast-bot
          cp target/release/meshcast-bot dist/meshcast-bot/
          cp scripts/deploy-bot.sh dist/meshcast-bot/
          cp README.md LICENSE dist/meshcast-bot/
          tar czf meshcast-bot-linux-x86_64.tar.gz -C dist meshcast-bot
      - uses: actions/upload-artifact@v4
        with:
          name: meshcast-bot-linux-x86_64.tar.gz
          path: meshcast-bot-linux-x86_64.tar.gz

  bot-image:
    name: Bot container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/meshcast-bot
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/bot/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub Release
    needs: [desktop, bot]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          # Pull the section for this version out of CHANGELOG.md (if present).
          awk -v ver="$TAG" '
            /^## / { if (found) exit; if (index($0, "[" ver "]") || index($0, " " ver " ") || index($0, " " ver "$")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md for details." > notes.md; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          files: artifacts/*
