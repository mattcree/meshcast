name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04: cros-libva (VA-API, via moq-media) needs libva >= 2.20, which
          # 22.04 lacks. Resulting Linux binaries need glibc >= 2.39 (Ubuntu 24.04+, Fedora 40+).
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: meshcast-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: meshcast-macos-aarch64.tar.gz
          # Intel macOS is cross-compiled on the Apple-Silicon runner (the
          # macos-13 x86_64 runners are retired and jobs queue forever).
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: meshcast-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: meshcast-windows-x86_64.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08)
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev libspa-0.2-dev \
            libclang-dev libva-dev nasm pkg-config cmake \
            libasound2-dev libgbm-dev libvulkan-dev \
            libxkbcommon-dev libgtk-3-dev libatk1.0-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install nasm cmake pkg-config

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p meshcast-app -p meshcast-cli

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p dist/meshcast
          cp target/${{ matrix.target }}/release/meshcast dist/meshcast/
          cp target/${{ matrix.target }}/release/meshcast-app dist/meshcast/
          cp scripts/meshcast-tray.py scripts/install.sh scripts/uninstall.sh dist/meshcast/
          cp packaging/linux/*.desktop dist/meshcast/
          cp README.md LICENSE dist/meshcast/
          tar czf ${{ matrix.archive }} -C dist meshcast

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist/meshcast
          cp target/${{ matrix.target }}/release/meshcast dist/meshcast/
          cp target/${{ matrix.target }}/release/meshcast-app dist/meshcast/
          cp scripts/install.sh scripts/uninstall.sh dist/meshcast/
          cp README.md LICENSE dist/meshcast/
          tar czf ${{ matrix.archive }} -C dist meshcast

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/meshcast | Out-Null
          Copy-Item target/${{ matrix.target }}/release/meshcast.exe dist/meshcast/
          Copy-Item target/${{ matrix.target }}/release/meshcast-app.exe dist/meshcast/
          Copy-Item scripts/install.ps1 dist/meshcast/
          Copy-Item README.md,LICENSE dist/meshcast/
          Compress-Archive -Path dist/meshcast -DestinationPath ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  bot:
    name: Bot (linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08)
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          key: bot
      - name: Build
        run: cargo build --release --locked -p meshcast-bot
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist/meshcast-bot
          cp target/release/meshcast-bot dist/meshcast-bot/
          cp scripts/deploy-bot.sh dist/meshcast-bot/
          cp README.md LICENSE dist/meshcast-bot/
          tar czf meshcast-bot-linux-x86_64.tar.gz -C dist meshcast-bot
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: meshcast-bot-linux-x86_64.tar.gz
          path: meshcast-bot-linux-x86_64.tar.gz

  bot-image:
    name: Bot container image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/meshcast-bot
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        env:
          # Don't upload the build-record artifact; it breaks download-artifact
          # in the release job and we have no use for it.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: packaging/bot/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub Release
    needs: [desktop, bot]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download release artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: meshcast-*
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          # Pull the section for this version out of CHANGELOG.md (if present).
          awk -v ver="$TAG" '
            /^## / { if (found) exit; if (index($0, "[" ver "]") || index($0, " " ver " ") || index($0, " " ver "$")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md for details." > notes.md; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          body_path: notes.md
          generate_release_notes: true
          files: artifacts/*
