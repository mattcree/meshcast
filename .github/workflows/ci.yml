name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint-and-test:
    name: Lint, test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08)
        with:
          components: rustfmt, clippy

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev libspa-0.2-dev \
            libclang-dev libva-dev nasm pkg-config cmake \
            libasound2-dev libgbm-dev libvulkan-dev \
            libxkbcommon-dev libgtk-3-dev libatk1.0-dev \
            shellcheck

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # End-to-end tests over real iroh endpoints (need the public relay /
      # discovery, so they are #[ignore] by default). Non-blocking until we've
      # seen them be reliable on hosted runners.
      - name: e2e (network)
        continue-on-error: true
        run: cargo test -p meshcast-cli -- --ignored --test-threads=1

      - name: shellcheck scripts
        run: shellcheck scripts/*.sh

      - name: python syntax (tray script)
        run: python3 -m py_compile scripts/meshcast-tray.py

  check-cross:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08)

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install nasm cmake pkg-config

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: cargo check
        run: cargo check --workspace --all-targets
